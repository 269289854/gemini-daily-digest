<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gemini Daily Digest — Admin X Cookie Sync</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div class="brand">
          <img src="icons/icon-32.png" alt="Logo" class="brand-icon" />
          <div>
            <h1 id="titleText" class="brand-title">X Cookie 管理员同步</h1>
            <p id="subtitleText" class="brand-sub">一键读取浏览器 x.com 登录态并热更新平台采集</p>
          </div>
        </div>
        <button id="langToggleBtn" type="button" class="pill-btn">EN</button>
      </header>

      <section class="card">
        <div class="card-head">
          <span id="serverSectionLabel" class="card-title">1. 目标站点与管理员会话</span>
          <span id="sessionBadge" class="badge badge-muted">未连接</span>
        </div>

        <label class="field-label" for="serverUrlInput" id="serverUrlLabel">服务地址 (Server URL)</label>
        <div class="input-row">
          <input
            id="serverUrlInput"
            type="url"
            placeholder="https://digest.example.com"
            autocomplete="off"
          />
          <button id="useActiveTabBtn" type="button" class="btn-secondary btn-compact">当前页</button>
        </div>

        <div class="btn-row">
          <button id="syncSessionBtn" type="button" class="btn-secondary">同步登录态并检查权限</button>
          <button id="openPortalBtn" type="button" class="btn-ghost">打开平台登录</button>
        </div>

        <div id="sessionMeta" class="meta-box hidden"></div>

        <details class="manual-details">
          <summary id="manualSummary">无法从标签页读取会话时，可手动填写管理员 Bearer Token</summary>
          <div class="manual-body">
            <input
              id="manualTokenInput"
              type="password"
              placeholder="eyJhbGciOiJSUzI1NiIs..."
              autocomplete="off"
            />
            <button id="applyManualTokenBtn" type="button" class="btn-secondary btn-compact">
              使用
            </button>
          </div>
        </details>
      </section>

      <section class="card">
        <div class="card-head">
          <span id="cookieSectionLabel" class="card-title">2. 浏览器 X (x.com) Cookie</span>
          <span id="cookieBadge" class="badge badge-muted">检测中</span>
        </div>

        <div id="cookieDetails" class="meta-box"></div>

        <div class="btn-row">
          <button id="refreshCookieBtn" type="button" class="btn-secondary">刷新 Cookie 检测</button>
          <button id="openXBtn" type="button" class="btn-ghost">打开 x.com</button>
        </div>
      </section>

      <section class="card">
        <div class="card-head">
          <span id="actionSectionLabel" class="card-title">3. 一键导入与端到端验证</span>
        </div>

        <button id="importCookieBtn" type="button" class="btn-primary" disabled>
          一键导入 X Cookie 并热更新
        </button>

        <div class="test-row">
          <input
            id="testHandleInput"
            type="text"
            value="GoogleDeepMind"
            placeholder="GoogleDeepMind"
            autocomplete="off"
          />
          <button id="testXBtn" type="button" class="btn-secondary" disabled>测试抓取</button>
        </div>

        <div id="statusBox" class="status-box hidden" role="status"></div>
        <div id="testResultBox" class="test-result hidden"></div>
      </section>
    </main>

    <script type="module" src="popup.js"></script>
  </body>
</html>
