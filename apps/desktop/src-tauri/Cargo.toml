[package]
name = "gemini-daily-digest-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.90"

[lib]
name = "gemini_daily_digest_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1"
digest-core = { path = "../../../crates/digest-core" }
digest-mcp = { path = "../../../crates/digest-mcp" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "gzip", "brotli"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["v4"] }
