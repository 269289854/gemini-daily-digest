[workspace]
resolver = "2"
members = [
    "crates/digest-core",
    "crates/digest-server",
    "crates/digest-mcp",
]
exclude = [
    "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.82"

[workspace.dependencies]
aes-gcm = "0.10"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
feed-rs = "2"
futures = "0.3"
hex = "0.4"
hmac = "0.12"
http = "1"
ipnet = "2"
lettre = { version = "0.11", default-features = false, features = ["tokio1-rustls-tls", "builder", "smtp-transport", "hostname"] }
pulldown-cmark = { version = "0.13", default-features = false }
rand = "0.8"
redis = { version = "0.27", default-features = false, features = ["tokio-comp", "connection-manager", "aio"] }
reqwest = { version = "0.12", default-features = false, features = ["http2", "rustls-tls", "gzip", "brotli", "stream", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = { version = "2", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
wiremock = "0.6"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
