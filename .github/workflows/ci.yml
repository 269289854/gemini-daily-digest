name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-linux:
    name: Linux Rust, Web & Docker CI
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run zero-secret scanner
        run: python3 scripts/check_secrets.py

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy across workspace
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace unit tests
        run: cargo test --workspace

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck web frontend
        run: pnpm --dir apps/web run typecheck

      - name: Run web frontend tests
        run: pnpm --dir apps/web run test -- --run

      - name: Build web frontend bundle
        run: pnpm --dir apps/web run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Verify Docker image build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gemini-daily-digest:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  ci-windows-desktop:
    name: Windows Tauri Desktop CI
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Desktop Rust dependencies
        uses: Swatinem/rust-cache@v2
        with:
          key: windows-desktop
          workspaces: apps/desktop/src-tauri

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: "12"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"

      - name: Install workspace JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web frontend dist for Tauri context
        run: pnpm --dir apps/web run build

      - name: Check Desktop Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check

      - name: Run Clippy on Desktop crate
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Run Desktop crate tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
